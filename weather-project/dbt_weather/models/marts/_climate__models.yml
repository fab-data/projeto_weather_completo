version: 2

models:
  - name: dim_date
    description: "Calendário contínuo com anos completos."
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

      - name: full_date
        tests:
          - unique
          - not_null

  - name: dim_time
    description: "Dimensão com as 24 horas do dia."
    columns:
      - name: hour_key
        tests:
          - unique
          - not_null

  - name: fct_weather_hr
    description: "Uma linha por localização e horário."
    columns:
      - name: weather_key
        tests:
          - unique
          - not_null

      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: hour_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time')
                field: hour_key