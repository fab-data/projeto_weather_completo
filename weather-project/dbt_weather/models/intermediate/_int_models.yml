version: 2

models:
  - name: int_weather__calculated
    description: "Dados horários com chaves e cálculos para consumo analítico."
    columns:
      - name: weather_key
        tests:
          - unique
          - not_null

      - name: date_key
        tests:
          - not_null

      - name: hour_key
        tests:
          - not_null